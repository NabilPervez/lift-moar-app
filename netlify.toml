[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side view state always resolves to the app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Digital Asset Links for the Android (TWA) wrapper — must be served as JSON
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Service worker + manifest must never be cached, or users get stuck on old builds
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
